  #######################################
  ##### Custom Resource Initialize #####
  #####################################

  StreamlitBuildCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ['-', ['BuildResourceRole', !Ref EnvironmentName]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      Policies:
        - PolicyName: CodeBuildPolicys
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt DataCodeBuild.Arn
                  # - !GetAtt StreamlitCodeBuild.Arn
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:ListBucketVersions
                Resource:
                  - !Sub arn:aws:s3:::DataSourceBucket-${EnvironmentName}/*
                  - !Sub arn:aws:s3:::DataSourceBucket-${EnvironmentName}
                    
  StreamlitBuildCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Join ['-', ['BuildResourceF', !Ref EnvironmentName]]
      Handler: index.handler
      Role: !GetAtt StreamlitBuildCustomResourceRole.Arn
      Timeout: 300
      Runtime: python3.12
      Code:
        ZipFile: 
          !Sub |
                import boto3
                from time import sleep
                import cfnresponse

                codebuild = boto3.client("codebuild")
                def start_codebuild(build_id):
                  while status not in ['SUCCEEDED', 'FAILED', 'STOPPED', 'FAULT', 'TIMED_OUT']:
                    status = codebuild.batch_get_builds(ids=[build_id])['builds'][0]['buildStatus']
                    sleep(15)
                  if status in ['FAILED', 'STOPPED', 'FAULT', 'TIMED_OUT']:
                    raise Exception("Build failed")
                  
                  return
                def handler(event, context):
                  try:
                    request_type = event['RequestType']
                    if request_type == 'Create':
                      status = 'STARTING'
                      start_codebuild(codebuild.start_build(projectName=event['ResourceProperties']['DATAPROJECT'])['build']['id'])
                      # start_codebuild(codebuild.start_build(projectName=event['ResourceProperties']['INITPROJECT'])['build']['id'])
                    elif request_type == 'Delete':
                      bucket = boto3.resource("s3").Bucket(event['ResourceProperties']['DATABUCKET'])
                      bucket.object_versions.delete()
                      bucket.objects.all().delete()
                  except Exception as ex:
                    print(ex)
                    bucket = boto3.resource("s3").Bucket(event['ResourceProperties']['DATABUCKET'])
                    bucket.object_versions.delete()
                    bucket.objects.all().delete()
                    cfnresponse.send(event, context, cfnresponse.FAILED, {})
                  else:
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  StreamlitBuildCustomResource:
    # DependsOn:
      # - DataSource
      # - AOSSCollectionAccessPolicy
      # - AOSSCollectionNetworkPolicy
    Type: Custom::BuildCode
    Properties:
      ServiceToken: !GetAtt StreamlitBuildCustomResourceFunction.Arn
      DATAPROJECT: !Ref DataCodeBuild
      # INITPROJECT: !Ref StreamlitInitCodebuild
      DATABUCKET: !Sub DataSourceBucket-${EnvironmentName}

  # ###########################################
  # ##### Custom Resource Clean Resource #####
  # #########################################

  StreamlitCleanCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ['-', ['CleanResourceRole', !Ref EnvironmentName]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      Policies:
        - PolicyName: S3DeleteObject
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:ListBucketVersions
                Resource:
                  - !Sub arn:aws:s3:::${DataSourceBucket}/*
                  - !Sub arn:aws:s3:::${DataSourceBucket}

  StreamlitCleanCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Join ['-', ['CleanResourceF', !Ref EnvironmentName]]
      Handler: index.handler
      Role: !GetAtt StreamlitCleanCustomResourceRole.Arn
      Timeout: 300
      Runtime: python3.12
      Code:
        ZipFile: 
            !Sub 
              |
                import boto3
                from time import sleep
                import cfnresponse
                from botocore.exceptions import ClientError

                def handler(event, context):
                  try:
                    request_type = event['RequestType']
                    if request_type == 'Delete':
                      bucket = boto3.resource("s3").Bucket(event['ResourceProperties']['DATABUCEKT'])
                      bucket.object_versions.delete()
                      bucket.objects.all().delete()
                  except Exception as ex:
                    print(ex)
                    cfnresponse.send(event, context, cfnresponse.FAILED, {})
                  else:
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
  
  StreamlitCleanCustomResource:
    Type: Custom::BuildCode
    Properties:
      ServiceToken: !GetAtt StreamlitCleanCustomResourceFunction.Arn
      DATABUCEKT: !Sub DataSourceBucket-${EnvironmentName}

  # #################################
  # ##### Custome Resource ECS #####
  # ###############################

  StreamlitECSRoleCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ['-', ['ECSCustomRole', !Ref EnvironmentName]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn  
      Policies:
        - PolicyName: IAMCreate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListRoles
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                  - iam:AttachRolePolicy
                Resource:
                  - "*"
                  
  StreamlitECSRoleCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Join ['-', ['ECSCustomF', !Ref EnvironmentName]]
      Handler: index.handler
      Role: !GetAtt StreamlitECSRoleCustomResourceRole.Arn
      Timeout: 300
      Runtime: python3.12
      Code:
        ZipFile: 
            !Sub 
              |
                import boto3
                from botocore.exceptions import ClientError
                import cfnresponse
                iam_client = boto3.client('iam')

                def handler(event, context):
                    
                    try:
                      request_type = event['RequestType']
                      print(request_type)

                      if request_type == 'Create':
                        desired_role_name = "AWSServiceRoleForECS"

                        try:
                          iam_client.get_role(RoleName=desired_role_name)
                          role_exists = True
                        except ClientError as e:
                          if e.response['Error']['Code'] == 'NoSuchEntity':
                            role_exists = False
                          else:
                            role_exists = True

                        print(role_exists)
                        if not role_exists:
                          iam_client.create_service_linked_role(AWSServiceName="ecs.amazonaws.com")
                    except Exception as ex:
                      print(ex)
                      cfnresponse.send(event, context, cfnresponse.FAILED, {})
                    else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
  
  StreamlitECSRoleCustomResource:
    Type: Custom::ECSRole
    Properties:
      ServiceToken: !GetAtt StreamlitECSRoleCustomResourceFunction.Arn 