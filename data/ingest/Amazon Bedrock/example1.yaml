AWSTemplateFormatVersion: '2010-09-09'
Description: |
  This CloudFormation template provisions an AWS infrastructure consisting of an S3 bucket for logging with versioning and  public access restrictions, two Python Lambda functions that leverage the Anthropic Bedrock model (specified via a parameter) to generate summaries and extract action items from meeting transcripts, an IAM role granting the necessary permissions to  the Lambda functions, and an API Gateway with two endpoints (/summary and /action_item) that invoke the respective Lambda  functions when provided with a meeting transcript as input. The API Gateway endpoints allow users to obtain either a concise  summary or a list of action items assigned to individuals/departments based on the meeting transcript, enabling efficient  post-meeting analysis and follow-up.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: EnironmentConfig
        Parameters:
          - ModelId

Parameters:
  ModelId:
    Type: String
    Description: The ID of the Bedrock model to use for the Lambda function
    Default: anthropic.claude-3-sonnet-20240229-v1:0

Resources:
  SummaryLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          ModelId: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          bedrock = boto3.client('bedrock-runtime')
          def get_response(prompt, modelId, temperature):
              response = bedrock.invoke_model(
                              modelId=modelId,
                              body=json.dumps(
                                  {
                                      "anthropic_version": "bedrock-2023-05-31",
                                      "max_tokens": 4096,
                                      "temperature": temperature,
                                      "messages": [
                                          {
                                              "role": "user",
                                              "content": [{"type": "text", "text": prompt}],
                                          }
                                      ],
                                  }
                              ),
                          )
              result = json.loads(response.get("body").read())
              response = result.get("content", [])[0]['text']
              return response
          def lambda_handler(event, context):
              text = event["queryStringParameters"]["text"]
              prompt = f"""
              Your task is to review the provided meeting transcript and create a concise summary.
              Meeting transcript:
              <notes>
                {text}
              </notes>
              Create a summary that captures the essential information.
              """
              summary = get_response(prompt=prompt, modelId=os.environ['ModelId'],temperature=0)
              return {
                  "statusCode": 200,
                  "body": json.dumps({"summary": summary})
              }

  ActionItemLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          ModelId: !Ref ModelId
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          bedrock = boto3.client('bedrock-runtime')
          def get_response(prompt, modelId, temperature):
              response = bedrock.invoke_model(
                              modelId=modelId,
                              body=json.dumps(
                                  {
                                      "anthropic_version": "bedrock-2023-05-31",
                                      "max_tokens": 4096,
                                      "temperature": temperature,
                                      "messages": [
                                          {
                                              "role": "user",
                                              "content": [{"type": "text", "text": prompt}],
                                          }
                                      ],
                                  }
                              ),
                          )
              result = json.loads(response.get("body").read())
              response = result.get("content", [])[0]['text']
              return response
          def lambda_handler(event, context):
              text = event["queryStringParameters"]["text"]
              prompt = f"""
              Your task is to review the provided meeting transcript and create an action items for each individual.
              Meeting transcript:
              <notes>
                {text}
              </notes>
              Create an action item list that captures the essential information, focusing on key takeaways and action items assigned to specific individuals or departments during the meeting.
              """
              action_items = get_response(prompt=prompt, modelId=os.environ['ModelId'],temperature=0)
              return {
                  "statusCode": 200,
                  "body": json.dumps({"action_items": action_items})
              }

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${ModelId}

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: BedrockRestAPI
      Description: API Gateway for meeting transcript analysis
      FailOnWarnings: true
  
  SummaryLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SummaryLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Join
        - ''
        - - 'arn:aws:execute-api:'
          - !Ref AWS::Region
          - ':'
          - !Ref AWS::AccountId
          - ':'
          - !Ref ApiGateway
          - '/*/*/*'

  ActionItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ActionItemLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Join
        - ''
        - - 'arn:aws:execute-api:'
          - !Ref AWS::Region
          - ':'
          - !Ref AWS::AccountId
          - ':'
          - !Ref ApiGateway
          - '/*/*/*'
  SummaryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: summary
      RestApiId: !Ref ApiGateway

  SummaryMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref SummaryResource
      RestApiId: !Ref ApiGateway
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ''
          - - 'arn:aws:apigateway:'
            - !Ref AWS::Region
            - ':lambda:path/2015-03-31/functions/'
            - !GetAtt SummaryLambdaFunction.Arn
            - '/invocations'
  
  ActionItemResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: action_item
      RestApiId: !Ref ApiGateway

  ActionItemMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref ActionItemResource
      RestApiId: !Ref ApiGateway
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ''
          - - 'arn:aws:apigateway:'
            - !Ref AWS::Region
            - ':lambda:path/2015-03-31/functions/'
            - !GetAtt ActionItemLambdaFunction.Arn
            - '/invocations'

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref ApiGateway
    DependsOn:
      - SummaryMethod
      - ActionItemMethod

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiGatewayDeployment

Outputs:
  ApiGatewayUrl:
    Value: !Join
      - ''
      - - 'https://'
        - !Ref ApiGateway
        - '.execute-api.'
        - !Ref AWS::Region
        - '.amazonaws.com/prod'
    Description: URL of the API Gateway endpoint